[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: the distribution is deliberately NOT called "odoo-mcp". That name is
# taken on PyPI by an unrelated project (erpipe-org/mcp-odoo, currently 1.3.0),
# and since this is installed editable at version 0.1.0, a stray
# `pip install --upgrade odoo-mcp` would resolve to 1.3.0 and silently replace
# this server — third-party code inheriting live Odoo credentials.
# The console script below stays `odoo-mcp`, so client configs are unaffected.
name = "molnkontakt-odoo-mcp"
version = "0.1.0"
description = "MCP server for Odoo (multi-instance, XML-RPC, with safety controls)"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
dependencies = [
    "fastmcp>=3.2.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "mypy>=2.0.0",
]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
